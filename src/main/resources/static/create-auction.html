<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Item - BidNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">BidNow</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="auctions.html">Auctions</a>
            <a class="nav-link active" href="create-auction.html">Sell Item</a>
            <a class="nav-link" href="login.html">Login</a>
            <a class="nav-link" href="register.html">Register</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="mb-4">Create New Auction</h3>
                    <p class="text-muted" id="sellerInfo">Please login as a Seller first.</p>

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="auctionTitle" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="auctionDesc" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Starting Price (₹)</label>
                            <input type="number" id="startingPrice" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Time</label>
                            <input type="datetime-local" id="startTime" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Time</label>
                            <input type="datetime-local" id="endTime" class="form-control">
                        </div>
                    </div>

                    <button class="btn btn-success w-100" onclick="createAuction()">Create Auction</button>
                    <div id="auctionMessage" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8090";
    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (currentUser) {
        document.getElementById("sellerInfo").innerText = `Creating auction as: ${currentUser.username} (ID: ${currentUser.id})`;
    }

    async function createAuction() {
        if (!currentUser) {
            alert("Please login first!");
            window.location.href = "login.html";
            return;
        }

        const title = document.getElementById("auctionTitle").value;
        const description = document.getElementById("auctionDesc").value;
        const startingPrice = document.getElementById("startingPrice").value;
        const startTime = document.getElementById("startTime").value + ":00";
        const endTime = document.getElementById("endTime").value + ":00";

        const url = `${API}/api/auctions?title=${encodeURIComponent(title)}&description=${encodeURIComponent(description)}&startingPrice=${startingPrice}&sellerId=${currentUser.id}&startTime=${startTime}&endTime=${endTime}`;

        const res = await fetch(url, { method: "POST" });
        const msg = document.getElementById("auctionMessage");

        if (res.ok) {
            const auction = await res.json();
            msg.innerHTML = `<div class="alert alert-success">Auction created successfully! ID: ${auction.id}</div>`;
        } else {
            const err = await res.json();
            msg.innerHTML = `<div class="alert alert-danger">${err.message || "Failed to create auction"}</div>`;
        }
    }
</script>

</body>
</html>
