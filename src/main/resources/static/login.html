<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BidNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">BidNow</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="auctions.html">Auctions</a>
            <a class="nav-link" href="create-auction.html">Sell Item</a>
            <a class="nav-link active" href="login.html">Login</a>
            <a class="nav-link" href="register.html">Register</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Login</h3>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="loginUsername" class="form-control" placeholder="Enter username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password">
                    </div>

                    <button class="btn btn-primary w-100" onclick="loginUser()">Login</button>
                    <div id="loginMessage" class="mt-3"></div>

                    <p class="text-center mt-3 mb-0">
                        Don't have an account? <a href="register.html">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8090";

    async function loginUser() {
        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;

        const res = await fetch(`${API}/api/users/login?username=${username}&password=${password}`, {
            method: "POST"
        });

        const msg = document.getElementById("loginMessage");
        if (res.ok) {
            const user = await res.json();
            localStorage.setItem("currentUser", JSON.stringify(user));
            msg.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
            setTimeout(() => {
                window.location.href = "auctions.html";
            }, 1000);
        } else {
            const err = await res.json();
            msg.innerHTML = `<div class="alert alert-danger">${err.message || "Invalid credentials"}</div>`;
        }
    }
</script>

</body>
</html>
