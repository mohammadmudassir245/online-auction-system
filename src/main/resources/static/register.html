<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BidNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">BidNow</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="auctions.html">Auctions</a>
            <a class="nav-link" href="create-auction.html">Sell Item</a>
            <a class="nav-link" href="login.html">Login</a>
            <a class="nav-link active" href="register.html">Register</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Create Account</h3>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="regUsername" class="form-control" placeholder="Enter username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="Enter email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="Enter password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select id="regRole" class="form-select">
                            <option value="BUYER">BUYER</option>
                            <option value="SELLER">SELLER</option>
                        </select>
                    </div>

                    <button class="btn btn-primary w-100" onclick="registerUser()">Register</button>
                    <div id="regMessage" class="mt-3"></div>

                    <p class="text-center mt-3 mb-0">
                        Already have an account? <a href="login.html">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8090";

    async function registerUser() {
        const username = document.getElementById("regUsername").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;
        const role = document.getElementById("regRole").value;

        const res = await fetch(`${API}/api/users/register?username=${username}&email=${email}&password=${password}&role=${role}`, {
            method: "POST"
        });

        const msg = document.getElementById("regMessage");
        if (res.ok) {
            const user = await res.json();
            msg.innerHTML = `<div class="alert alert-success">Registered successfully! Your User ID is <strong>${user.id}</strong>. <a href="login.html">Login now</a></div>`;
        } else {
            const err = await res.json();
            msg.innerHTML = `<div class="alert alert-danger">${err.message || "Registration failed"}</div>`;
        }
    }
</script>

</body>
</html>
