<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BidNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">BidNow</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="auctions.html">Auctions</a>
            <a class="nav-link" href="create-auction.html">Sell Item</a>
            <a class="nav-link" href="login.html">Login</a>
            <a class="nav-link" href="register.html">Register</a>
            <a class="nav-link active" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="mb-3">Contact Us</h3>
                    <p class="text-muted">Have questions about BidNow? Send us a message.</p>

                    <div class="mb-3">
                        <label class="form-label">Your Name</label>
                        <input type="text" id="name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea id="message" class="form-control" rows="4"></textarea>
                    </div>

                    <button class="btn btn-primary w-100" onclick="sendMessage()">Send Message</button>
                    <div id="contactMessage" class="mt-3"></div>
                </div>
            </div>

            <div class="text-center mt-4 text-muted">
                <p class="mb-1"><strong>BidNow</strong> — Real-time Online Auction System</p>
                <p class="mb-0">Built with Spring Boot + WebSocket + MySQL</p>
            </div>
        </div>
    </div>
</div>

<script>
    function sendMessage() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        if (!name || !email || !message) {
            document.getElementById("contactMessage").innerHTML =
                `<div class="alert alert-warning">Please fill all fields.</div>`;
            return;
        }

        document.getElementById("contactMessage").innerHTML =
            `<div class="alert alert-success">Thank you, ${name}! Your message has been received.</div>`;
    }
</script>

</body>
</html>
