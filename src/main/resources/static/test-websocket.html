<!DOCTYPE html>
<html>
<head>
    <title>Auction Real-time Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>Real-time Auction Bidding Test</h2>

<p>Auction ID: <input type="number" id="auctionId" value="1"></p>
<button onclick="connect()">Connect to Auction</button>
<button onclick="disconnect()">Disconnect</button>

<h3>Live Bids:</h3>
<ul id="bids"></ul>

<script>
    let stompClient = null;

    function connect() {
        const auctionId = document.getElementById("auctionId").value;
        const socket = new SockJS('http://localhost:8090/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            stompClient.subscribe('/topic/auction/' + auctionId, function (message) {
                const bid = JSON.parse(message.body);
                showBid(bid);
            });
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        console.log("Disconnected");
    }

    function showBid(bid) {
        const bidsList = document.getElementById("bids");
        const li = document.createElement("li");
        li.textContent = `New Bid: ₹${bid.amount} by User ID ${bid.bidder.id} at ${bid.bidTime}`;
        bidsList.prepend(li);
    }
</script>
</body>
</html>
