<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auctions - BidNow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        .status-LIVE { background-color: #198754; }
        .status-UPCOMING { background-color: #ffc107; color: #000; }
        .status-CLOSED { background-color: #6c757d; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">BidNow</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="auctions.html">Auctions</a>
            <a class="nav-link" href="create-auction.html">Sell Item</a>
            <a class="nav-link" href="login.html">Login</a>
            <a class="nav-link" href="register.html">Register</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">All Auctions</h2>
            <small id="userStatus" class="text-muted">Not logged in</small>
        </div>
        <button class="btn btn-outline-primary" onclick="loadAuctions()">Refresh</button>
    </div>

    <div id="auctionsList" class="row g-3 mb-4"></div>

    <!-- Place Bid -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white">
            <h5 class="mb-0">Place a Bid</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Auction ID</label>
                    <input type="number" id="bidAuctionId" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Bid Amount (₹)</label>
                    <input type="number" id="bidAmount" class="form-control">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-warning w-100" onclick="placeBid()">Place Bid</button>
                </div>
            </div>
            <div id="bidMessage" class="mt-3"></div>
        </div>
    </div>

    <!-- Live Updates -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white">
            <h5 class="mb-0">Live Bid Updates</h5>
        </div>
        <div class="card-body">
            <ul id="liveBids" class="list-group list-group-flush"></ul>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8090";
    let stompClient = null;
    let currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (currentUser) {
        document.getElementById("userStatus").innerText = `Logged in as: ${currentUser.username} (ID: ${currentUser.id})`;
    }

    async function loadAuctions() {
        const res = await fetch(`${API}/api/auctions`);
        const auctions = await res.json();
        const container = document.getElementById("auctionsList");
        container.innerHTML = "";

        auctions.forEach(a => {
            const col = document.createElement("div");
            col.className = "col-md-6 col-lg-4";
            col.innerHTML = `
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <h5 class="card-title mb-0">${a.title}</h5>
                            <span class="badge status-${a.status}">${a.status}</span>
                        </div>
                        <p class="text-muted small">${a.description || ""}</p>
                        <p class="mb-1"><strong>Current:</strong> ₹${a.currentPrice}</p>
                        <p class="mb-3"><strong>Ends:</strong> ${a.endTime ? a.endTime.replace("T", " ").substring(0, 16) : "-"}</p>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="connectToAuction(${a.id})">Watch Live</button>
                        ${a.status === 'UPCOMING' ? `<button class="btn btn-sm btn-success" onclick="startAuction(${a.id})">Start</button>` : ''}
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
    }

    async function startAuction(id) {
        const res = await fetch(`${API}/api/auctions/${id}/start`, { method: "PUT" });
        if (res.ok) {
            alert("Auction started!");
            loadAuctions();
        } else {
            const err = await res.json();
            alert(err.message);
        }
    }

    async function placeBid() {
        if (!currentUser) {
            alert("Please login first!");
            window.location.href = "login.html";
            return;
        }

        const auctionId = document.getElementById("bidAuctionId").value;
        const amount = document.getElementById("bidAmount").value;

        const res = await fetch(`${API}/api/bids?auctionId=${auctionId}&bidderId=${currentUser.id}&amount=${amount}`, {
            method: "POST"
        });

        const msg = document.getElementById("bidMessage");
        if (res.ok) {
            const bid = await res.json();
            msg.innerHTML = `<div class="alert alert-success">Bid placed: ₹${bid.amount}</div>`;
            loadAuctions();
        } else {
            const err = await res.json();
            msg.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
        }
    }

    function connectToAuction(auctionId) {
        if (stompClient) stompClient.disconnect();
        const socket = new SockJS(`${API}/ws`);
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, () => {
            stompClient.subscribe(`/topic/auction/${auctionId}`, (message) => {
                const bid = JSON.parse(message.body);
                const li = document.createElement("li");
                li.className = "list-group-item";
                li.innerHTML = `<strong>Auction ${auctionId}</strong> → ₹${bid.amount} by User ${bid.bidder.id}`;
                document.getElementById("liveBids").prepend(li);
            });
            alert(`Watching live updates for Auction ${auctionId}`);
        });
    }

    loadAuctions();
</script>

</body>
</html>
